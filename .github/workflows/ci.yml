name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race detector, coverage)
        run: go test -race -count=1 -cover ./...
      - name: benchmarks run
        run: go test -run xxx -bench . -benchtime 20x ./internal/sched ./internal/sim
      - name: simulator smoke test
        run: go run ./cmd/gpuq-sim -jobs 500 -seeds 2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker build -t gpuq:ci .
      - name: smoke test the container
        run: |
          docker run -d --name gpuqd -p 8080:8080 gpuq:ci -addr=:8080 -policy=fairshare -quota=a=4
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/v1/jobs -d '{"team":"a","nodes":1,"gpus_per_node":4,"runtime_s":60}'
          curl -fsS localhost:8080/metrics | grep '^gpuq_jobs_running 1'
          docker logs gpuqd
