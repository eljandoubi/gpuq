name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race detector, coverage)
        run: go test -race -count=1 -cover ./...
      - name: benchmarks run
        run: go test -run xxx -bench . -benchtime 20x ./internal/sched ./internal/sim
      - name: simulator smoke test
        run: go run ./cmd/gpuq-sim -jobs 500 -seeds 2
